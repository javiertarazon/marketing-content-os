services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-content}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-content}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-content} -d ${POSTGRES_DB:-content}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["future-queue"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-content}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-content}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ../apps/dashboard
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_MIXPOST_URL: ${NEXT_PUBLIC_MIXPOST_URL:-http://localhost:3002/mixpost}
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - api

  publisher:
    profiles: ["publisher"]
    build:
      context: ../apps/publisher-service
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      # Desde la red de Docker el servicio Mixpost se llama por su nombre de
      # servicio, no por localhost:3002 (que dentro del contenedor es el
      # propio publisher).
      MIXPOST_BASE_URL: http://mixpost/mixpost/api
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      - api
      - mixpost

  worker-gateway:
    image: nginx:1.27-alpine
    profiles: ["colab-tunnel"]
    volumes:
      - ./worker-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8002:8080"
    depends_on:
      - api

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["colab-tunnel"]
    command: tunnel --no-autoupdate --url http://worker-gateway:8080
    depends_on:
      - worker-gateway

  mixpost:
    image: inovector/mixpost:latest
    profiles: ["scheduler", "publisher"]
    environment:
      APP_NAME: Marketing Content OS
      APP_KEY: ${MIXPOST_APP_KEY:?Define MIXPOST_APP_KEY en .env}
      APP_DEBUG: "false"
      APP_DOMAIN: ${MIXPOST_DOMAIN:-localhost:3002}
      APP_URL: ${MIXPOST_URL:-http://localhost:3002}
      # Mixpost Lite sirve la API (y la UI) bajo este prefijo:
      # http://host:3002/mixpost/api/...
      MIXPOST_CORE_PATH: ${MIXPOST_CORE_PATH:-mixpost}
      DB_HOST: mixpost-mysql
      DB_PORT: 3306
      DB_DATABASE: ${MIXPOST_DB_NAME:-mixpost}
      DB_USERNAME: ${MIXPOST_DB_USER:-mixpost}
      DB_PASSWORD: ${MIXPOST_DB_PASSWORD:?Define MIXPOST_DB_PASSWORD en .env}
      REDIS_HOST: mixpost-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: null
      MIXPOST_DISK: public
    ports:
      - "127.0.0.1:3002:80"
    volumes:
      - mixpost_storage:/var/www/html/storage/app
      - mixpost_logs:/var/www/html/storage/logs
    depends_on:
      mixpost-mysql:
        condition: service_healthy
      mixpost-redis:
        condition: service_healthy

  mixpost-mysql:
    image: mysql/mysql-server:8.0
    profiles: ["scheduler", "publisher"]
    environment:
      MYSQL_DATABASE: ${MIXPOST_DB_NAME:-mixpost}
      MYSQL_USER: ${MIXPOST_DB_USER:-mixpost}
      MYSQL_PASSWORD: ${MIXPOST_DB_PASSWORD:?Define MIXPOST_DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MIXPOST_DB_ROOT_PASSWORD:?Define MIXPOST_DB_ROOT_PASSWORD en .env}
    volumes:
      - mixpost_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 20s
      retries: 10

  mixpost-redis:
    image: redis:7-alpine
    profiles: ["scheduler", "publisher"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  mixpost_storage:
  mixpost_logs:
  mixpost_mysql:
