name: Notebook CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      docker:
        image: docker:24.0-dind
        privileged: true
        options: --tls=false
        ports:
          - 2375:2375
    env:
      DOCKER_HOST: tcp://localhost:2375
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv venv --python 3.11 .venv
          source .venv/bin/activate
          uv pip install -r apps/api/requirements-dev.txt -r packages/python/adapters/requirements.txt
          npm ci --prefix apps/dashboard

      - name: Run pytest suite
        run: |
          source .venv/bin/activate
          pytest -q

      - name: Typecheck and build dashboard
        run: |
          npm run --prefix apps/dashboard build

      - name: Validate notebooks compile
        # Los workers no se pueden ejecutar fuera de Colab: requieren los
        # Secrets de Colab, un API_BASE_URL publico por HTTPS y los Spaces
        # privados de Hugging Face. Aqui solo se comprueba que el codigo de
        # las celdas es Python valido.
        run: |
          source .venv/bin/activate
          python - <<'PY'
          import json, pathlib, sys
          failures = []
          for nb in sorted(pathlib.Path("notebooks").glob("*.ipynb")):
              data = json.loads(nb.read_text(encoding="utf-8"))
              source = "\n".join(
                  "".join(c.get("source", []))
                  for c in data["cells"] if c.get("cell_type") == "code"
              )
              cleaned = "\n".join(
                  line for line in source.splitlines()
                  if not line.strip().startswith(("%", "!"))
              ).replace("await ", "")
              try:
                  compile(cleaned, nb.name, "exec")
              except SyntaxError as exc:
                  failures.append(f"{nb.name}:{exc.lineno}: {exc.msg}")
              print(f"{nb.name}: ok")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          PY

      - name: Start Docker Compose services
        run: |
          cp .env.example .env || true
          docker compose -f docker-compose.dev.yml up -d

      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/healthz > /dev/null; then
              echo "API healthy"
              exit 0
            fi
            echo "Waiting for API..." && sleep 5
          done
          echo "API never became healthy"
          docker compose -f docker-compose.dev.yml logs api
          exit 1

      - name: Smoke test the API and worker protocol
        run: |
          source .venv/bin/activate
          python scripts/smoke_local_pipeline.py
        env:
          WORKER_API_TOKEN: ci-worker-token
          API_BASE_URL: http://localhost:8000
          # MinIO del stack de dev, alcanzado por el puerto publicado en el host.
          S3_ENDPOINT_URL: http://127.0.0.1:9000
          S3_BUCKET: content-media
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          POSTGRES_USER: content
          POSTGRES_PASSWORD: change-this-local-password
          POSTGRES_DB: content
