name: Notebook CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      docker:
        image: docker:24.0-dind
        privileged: true
        options: --tls=false
        ports:
          - 2375:2375
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv venv --python 3.11 .venv
          source .venv/bin/activate
          uv pip install -r apps/api/requirements-dev.txt -r packages/python/adapters/requirements.txt
          npm ci --prefix apps/dashboard

      - name: Start Docker Compose services
        run: |
          cp .env.example .env || true
          docker compose -f infra/docker-compose.dev.yml up -d
        env:
          DOCKER_HOST: tcp://localhost:2375

      - name: Start Cloudflare tunnel (quick tunnel)
        run: |
          docker compose -f infra/docker-compose.dev.yml --profile colab-tunnel up -d cloudflared worker-gateway
        env:
          DOCKER_HOST: tcp://localhost:2375

      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8000/healthz > /dev/null; then break; fi
            echo "Waiting for API..." && sleep 5
          done
        env:
          DOCKER_HOST: tcp://localhost:2375

      - name: Execute notebooks
        run: |
          source .venv/bin/activate
          jupyter nbconvert --to notebook --execute notebooks/01_research_scrapegraph.ipynb --ExecutePreprocessor.timeout=1800
          jupyter nbconvert --to notebook --execute notebooks/02_render_remotion.ipynb --ExecutePreprocessor.timeout=1800
        env:
          DOCKER_HOST: tcp://localhost:2375
          API_BASE_URL: "http://localhost:8000"
          # Export other env vars required by notebooks here, e.g.:
          # WORKER_API_TOKEN=${{ secrets.WORKER_API_TOKEN }}
          # S3_ENDPOINT_URL=${{ secrets.S3_ENDPOINT_URL }}
          # S3_BUCKET=${{ secrets.S3_BUCKET }}
          # S3_ACCESS_KEY_ID=${{ secrets.S3_ACCESS_KEY_ID }}
          # S3_SECRET_ACCESS_KEY=${{ secrets.S3_SECRET_ACCESS_KEY }}
          # HF_TOKEN=${{ secrets.HF_TOKEN }}
